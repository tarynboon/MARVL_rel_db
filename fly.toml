# Fly.io config for MARVL Video Database API
# Run `fly launch` to create the app, then `fly deploy` to update
app = "marvl-video-db"
primary_region = "sjc"

[build]

[env]
  DB_PATH = "/data/marvl.db"

[mounts]
  source = "marvl_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
