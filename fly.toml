# fly.toml app configuration file generated for marvl-rel-db on 2026-05-20T21:59:09-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'marvl-rel-db'
primary_region = 'sjc'

[build]

[env]
  DB_PATH = "/data/marvl.db"

[mounts]
  source = "marvl_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
